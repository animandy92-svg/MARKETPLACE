name: Publish signed Android testing APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-testing-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: flutter build apk --debug
        working-directory: mobile
      - name: Restore the existing testing signing key
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_TEST_KEYSTORE_BASE64" || { echo 'The testing signing key secret is required.'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android |
            grep -qi 'D0:2D:CC:BB:B7:8D:A4:76:A2:4C:2F:7E:E4:9E:81:7C:69:DF:87:BB:A0:AE:13:48:09:39:B5:CC:23:EF:04:EA'
      - name: Verify, package, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {split($2, parts, "+"); print parts[1]}' mobile/pubspec.yaml)
          tag="v$version"
          apk="jack-of-all-trades-$version.apk"
          checksum="jack-of-all-trades-$version.sha256"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android --v4-signing-enabled false \
            --out "$apk" mobile/build/app/outputs/flutter-apk/app-debug.apk
          "$apksigner" verify --verbose --print-certs "$apk" | tee signature.txt
          grep -qi 'certificate SHA-256 digest: d02dccbbb78da476a24c2f7ee49e817c69df87bba0ae13480939b5cc23ef04ea' signature.txt ||
            { echo 'The APK signing certificate does not match the existing testing app.'; exit 1; }
          sha256sum "$apk" > "$checksum"
          if gh release view "$tag" --json isDraft > release.json 2>/dev/null; then
            test "$(jq -r .isDraft release.json)" = true || { echo 'An already-published release will not be replaced.'; exit 1; }
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "Jack of All Trades · Android $version (testing)" --notes-file "docs/releases/$version.md"
          fi
          gh release edit "$tag" --target "$GITHUB_SHA" --notes-file "docs/releases/$version.md"
          gh release upload "$tag" "$apk" "$checksum" --clobber
          gh release edit "$tag" --draft=false
          gh release view "$tag" --json url,assets
      - name: Remove the temporary local key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
