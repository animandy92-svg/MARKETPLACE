name: marketplace
description: Jack of All Trades marketplace for Android and iOS.
publish_to: none
version: 1.2.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.10.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand-icon.png
    - assets/google-mark.png
